name: docker-publish

on:
  push:
    branches: [master]
    # Only build a new image when something that actually changes the image
    # is touched. Docs/config/session drops (.ai/, *.md, README, docs, the
    # .superpowers plugin folder, etc.) must NOT trigger a publish; Go or web
    # source, the Dockerfile, go.mod/go.sum, and the workflow itself do.
    # Push a v* tag or use workflow_dispatch to force a build anytime.
    paths-ignore:
      - "**/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".ai/**"
      - "docs/**"
      - ".superpowers/**"
      - ".gitignore"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - "LICENSE*"
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name automatically.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Derive version string
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Skip provenance/SBOM attestations so the GHCR package page shows a
          # clean 2-arch manifest (no extra unknown/unknown platform entry).
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every new image build gets a GitHub Release with an auto-generated
  # changelog. Runs only on a build-relevant push to master (a docs-only push
  # skips the whole workflow via the paths-ignore above, so it also skips
  # this). The release's git tag is the BARE short SHA (not "v<sha>") so that
  # creating the tag does NOT re-trigger this workflow's `tags: ["v*"]` branch
  # -- otherwise every code push would build the image twice. It is displayed
  # and titled as `v<shortsha>`.
  release:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute short-SHA tag
        id: tag
        run: echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Skip if this SHA already has a release
        id: exists
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --json tagName >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate changelog
        if: steps.exists.outputs.skip == 'false'
        run: |
          prev=""
          if last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null); then
            prev="$last"
          fi
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" >/dev/null 2>&1; then
            range="$prev..${GITHUB_SHA}"
            link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA}"
          else
            # First release for the repo: diff this push against its parent.
            # Use the event context (`github.event.before`), not a shell env var
            # — GITHUB_EVENT_BEFORE is not a real Actions variable.
            range="${{ github.event.before }}..${GITHUB_SHA}"
            link=""
          fi
          bash .github/scripts/changelog.sh "$range" > CHANGELOG.md
          if [ -n "$link" ]; then
            printf '\n**Full Changelog**: %s\n' "$link" >> CHANGELOG.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: v${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG.md
          target_commitish: ${{ github.sha }}

